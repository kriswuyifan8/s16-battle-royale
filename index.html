<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英雄联盟S16全球总决赛队伍大逃杀</title>
<style>
  /* ===== 基础 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0b0d10;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: #e8e6e1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }

  /* ===== 舞台 ===== */
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 1.7778));
    aspect-ratio: 1000 / 562;
    max-height: 100vh;
    background: #101216;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ===== 排名栏 ===== */
  .rankCol {
    position: absolute; top: 46px; bottom: 40px; width: 34px; z-index: 6;
    background: rgba(10,12,15,0.72);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 4px 0;
    display: flex; flex-direction: column; flex-wrap: wrap;
    align-content: center;
    overflow: hidden;
  }
  .rankCol.left { left: 6px; }
  .rankCol.right { right: 6px; }
  .rankCol .rk {
    width: 24px; height: 24px; margin: 2px 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.22);
    background: transparent;
    box-sizing: border-box;
    transition: all .3s ease;
  }
  .rankCol .rk.waiting { color: #7c838b; }
  .rankCol .rk canvas { display: block; border-radius: 50%; }
  .rankCol .rk.dead { border-color: #ff5252; color: #ff5252; background: rgba(255,82,82,0.12); }
  .rankCol .rk.champ { border-color: #f5c518; color: #f5c518; background: rgba(245,197,24,0.16); }

  /* ===== HUD ===== */
  .hud { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; pointer-events: none; z-index: 7; }
  .hud.top { top: 0; }
  .hud.bottom { bottom: 0; z-index: 21; }   /* 浮在封面/结算遮罩之上，设置与按钮随时可点 */
  .pill {
    background: rgba(16,18,22,0.78);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    color: #f5c518;
  }
  .pill .dim { color: #9aa0a8; font-weight: 400; font-size: 12px; }

  #ctrlGroup { display: flex; gap: 8px; pointer-events: auto; }
  .gearBtn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px;
    background: rgba(16,18,22,0.78);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    color: #e8e6e1; font-size: 21px; line-height: 1;
    cursor: pointer;
    pointer-events: auto;   /* HUD 父级 pointer-events:none，需单独放开 */
    user-select: none;
  }
  .gearBtn:hover { background: rgba(60,66,76,0.85); }
  .gearBtn:active { transform: scale(0.94); }
  /* ===== 设置面板 ===== */
  .setGroup { margin-bottom: 14px; }
  .setGroup h4 {
    font-size: 13px; font-weight: 700; color: #f5c518;
    margin: 0 0 6px; letter-spacing: .5px;
  }
  .setRow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 4px 0; font-size: 13px; color: #c9cdd3;
  }
  .setRow label { white-space: nowrap; }
  .setRow .numGrp { display: flex; align-items: center; gap: 6px; }
  .setRow input[type=number] {
    width: 62px; padding: 4px 6px; border-radius: 8px; text-align: center;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06); color: #e8e6e1; font-size: 13px;
    -moz-appearance: textfield; appearance: textfield;
  }
  .setRow input[type=checkbox] { width: 18px; height: 18px; accent-color: #f5a623; cursor: pointer; }
  .setBtns { display: flex; gap: 10px; justify-content: space-between; margin-top: 6px; }
  .setTip { font-size: 11px; color: #8a919b; text-align: center; margin-top: 10px; }
  .ctrlBtn {
    min-width: 44px; min-height: 44px; padding: 6px 16px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(16,18,22,0.82);
    color: #e8e6e1; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ctrlBtn:hover { background: rgba(60,66,76,0.85); }
  .ctrlBtn:active { transform: scale(0.96); }
  .ctrlBtn.warn { border-color: rgba(245,197,24,0.6); color: #f5c518; }

  /* ===== 覆盖面板 ===== */
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,10,13,0.86);
    backdrop-filter: blur(3px);
    transition: opacity .25s ease;
    overflow-y: auto;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; visibility: hidden; }

  /* 设置面板需浮在开局封面上方（封面与 overlay 同为 z-index:20，DOM 靠后遮挡） */
  #settingsOverlay { z-index: 40; }
  /* 开局封面：全屏黑色，不用卡片；遮罩穿透，保证左下角齿轮/右下角按钮可点 */
  #openOverlay {
    background: #05070a;
    backdrop-filter: none;
    overflow-y: auto;
    pointer-events: none;
  }
  #openOverlay .coverWrap { pointer-events: auto; }
  .coverWrap {
    width: min(96%, 760px);
    margin: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 0;
  }
  .coverBoard { width: 100%; max-width: 420px; }
  /* 结算面板：半透明背景，让场景烟花可见；遮罩穿透，左下角齿轮仍可点 */
  #resultOverlay {
    background: rgba(8,10,13,0.42);
    backdrop-filter: none;
    pointer-events: none;
  }
  #resultOverlay .panel { pointer-events: auto; }
  .panel {
    width: min(88%, 470px);
    max-height: 94%;
    overflow-y: auto;
    background: linear-gradient(180deg, #1d2127, #16191e);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 26px 24px 22px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.6);
  }
  .panel h1 { font-size: 27px; font-weight: 900; letter-spacing: 2px; color: #f5c518; margin-bottom: 4px; }
  .panel h1 .s { color: #e8e6e1; }
  .panel .sub { font-size: 13.5px; color: #a8aeb6; margin-bottom: 16px; }
  .panel .rules {
    text-align: left; font-size: 13px; color: #c3c8cf; line-height: 1.9;
    background: rgba(255,255,255,0.04);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
  }
  .panel .rules b { color: #f5c518; font-weight: 600; }
  .bigBtn {
    display: inline-block; min-width: 190px; min-height: 48px; padding: 0 28px;
    border: none; border-radius: 12px; cursor: pointer;
    background: #f5c518; color: #1a1500;
    font-size: 17px; font-weight: 800; letter-spacing: 2px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 6px 20px rgba(245,197,24,0.28);
  }
  .bigBtn:hover { transform: translateY(-1px); box-shadow: 0 8px 26px rgba(245,197,24,0.4); }
  .bigBtn:active { transform: scale(0.97); }

  .champBig { font-size: 42px; font-weight: 900; color: #f5c518; line-height: 1.2; margin: 4px 0 2px; }
  .coverTitle {
    font-size: 44px; font-weight: 900; letter-spacing: 2px; text-align: center;
    color: #7ef0a0; text-shadow: 0 0 24px rgba(126,240,160,0.55), 0 2px 0 rgba(0,0,0,0.6);
    margin-bottom: 10px;
  }
  #coverCanvas { display: block; margin: 0 auto 12px; max-width: 100%; height: auto; border-radius: 14px; }
  .goldMedal {
    width: 96px; height: 96px; margin: 0 auto 12px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fffbe0, #f5c518 46%, #c9930a 78%, #8a6508);
    border: 4px solid #e8b923;
    box-shadow: 0 0 22px rgba(245,197,24,0.6), inset 0 0 14px rgba(255,255,255,0.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #6b4d00; position: relative;
  }
  .goldMedal::after {
    content: ''; position: absolute; left: 14px; top: 10px; width: 22px; height: 14px;
    background: rgba(255,255,255,0.65); border-radius: 50%; transform: rotate(-18deg);
  }
  .goldMedal .gm1 { font-size: 34px; font-weight: 900; line-height: 1; text-shadow: 0 1px 0 rgba(255,255,255,0.5); }
  .goldMedal .gmTxt { font-size: 12px; font-weight: 800; letter-spacing: 2px; margin-top: 1px; }
  @keyframes goldPop {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }
    70% { transform: scale(1.15) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  #resultOverlay .goldMedal { animation: goldPop .55s cubic-bezier(.2,1.4,.4,1) .15s backwards; }
  .champLine { font-size: 14.5px; color: #c3c8cf; margin-bottom: 14px; }
  .champLine .cn { font-weight: 700; }
  .podium { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .podium .p {
    flex: 1; max-width: 120px; padding: 8px 6px; border-radius: 10px;
    background: rgba(255,255,255,0.05); font-size: 12px; color: #a8aeb6;
  }
  .podium .p .n { font-size: 15px; font-weight: 700; color: #e8e6e1; display: block; margin-top: 2px; }
  .board {
    text-align: left; font-size: 12px; color: #9aa0a8;
    background: rgba(255,255,255,0.04);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 16px;
    max-height: 118px; overflow-y: auto;
  }
  .board .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .board .row b { color: #e8e6e1; font-weight: 600; }
  .board .empty { text-align: center; padding: 6px 0; }

  #pauseMask { position: absolute; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; background: rgba(8,10,13,0.7); }
  #pauseMask.hidden { display: none; }
  #pauseMask .txt { font-size: 22px; font-weight: 800; color: #f5c518; letter-spacing: 6px; }

  @media (max-width: 640px) {
    .panel h1 { font-size: 21px; }
    .champBig { font-size: 32px; }
    .pill { font-size: 12px; padding: 5px 10px; }
    .rankCol { width: 26px; top: 40px; }
    .rankCol .rk { width: 20px; height: 20px; margin: 1.5px 0; font-size: 10px; border-width: 1.5px; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <!-- 左右排名栏 -->
  <div id="rankLeft" class="rankCol left"></div>
  <div id="rankRight" class="rankCol right"></div>

  <!-- HUD -->
  <div class="hud top">
    <div class="pill"><span class="dim">幸存</span><span id="totalNum">19</span><span class="dim">/ 19</span></div>
    <div class="pill"><span class="dim">⏱</span><span id="gameTimer">00:00</span></div>
  </div>
  <div class="hud bottom">
    <button id="settingsBtn" class="gearBtn" title="游戏设置">⚙</button>
    <div id="ctrlGroup">
      <button id="pauseBtn" class="ctrlBtn">暂停</button>
      <button id="restartBtn" class="ctrlBtn warn">重新开始</button>
    </div>
  </div>

  <!-- 暂停遮罩 -->
  <div id="pauseMask" class="hidden"><div class="txt">已暂停</div></div>

  <!-- 设置面板 -->
  <div id="settingsOverlay" class="overlay hidden">
    <div class="panel" style="width:min(92%,420px);">
      <h1 style="font-size:20px;margin-bottom:14px;">游戏设置 <span style="font-size:12px;color:#8a919b;font-weight:400;">（改动下一局生效）</span></h1>
      <div class="setGroup">
        <h4>① 救援杆</h4>
        <div class="setRow"><label>开启救援杆</label><input type="checkbox" id="setLifterOn"></div>
        <div class="setRow"><label>决赛圈自动开启（剩 2 队）</label><input type="checkbox" id="setLifterFinale"></div>
        <div class="setRow"><label>频率（秒）</label><span class="numGrp"><input type="number" id="setLifterMin" step="0.5" min="0.5"> ~ <input type="number" id="setLifterMax" step="0.5" min="0.5"></span></div>
      </div>
      <div class="setGroup">
        <h4>② 横杆</h4>
        <div class="setRow"><label>开启横杆</label><input type="checkbox" id="setPoleOn"></div>
        <div class="setRow"><label>长度（像素）</label><input type="number" id="setPoleLen" step="10" min="60"></div>
        <div class="setRow"><label>移动速度（倍率）</label><input type="number" id="setPoleSpd" step="0.5" min="0.5"></div>
      </div>
      <div class="setGroup">
        <h4>③ 旋转杆</h4>
        <div class="setRow"><label>开启旋转杆</label><input type="checkbox" id="setRotOn"></div>
        <div class="setRow"><label>转速（°/秒）</label><input type="number" id="setRotSpd" step="10" min="0"></div>
        <div class="setRow"><label>长度（像素）</label><input type="number" id="setRotLen" step="10" min="40"></div>
        <div class="setRow"><label>水平高度（像素）</label><input type="number" id="setRotY" step="5" min="280" max="460"></div>
      </div>
      <div class="setGroup">
        <h4>④ 平台</h4>
        <div class="setRow"><label>宽度（像素）</label><input type="number" id="setPlatW" step="10" min="600" max="1000"></div>
        <div class="setRow"><label>高度（像素）</label><input type="number" id="setPlatH" step="10" min="120" max="300"></div>
      </div>
      <div class="setGroup">
        <h4>⑤ 繁殖</h4>
        <div class="setRow"><label>繁殖间隔（秒）</label><span class="numGrp"><input type="number" id="setBreedMin" step="0.5" min="0.5"> ~ <input type="number" id="setBreedMax" step="0.5" min="0.5"></span></div>
      </div>
      <div class="setBtns">
        <button id="setResetBtn" class="ctrlBtn warn">恢复默认</button>
        <button id="setSaveBtn" class="ctrlBtn" style="border-color:rgba(245,197,24,.6);color:#f5c518;">保存</button>
      </div>
      <div class="setTip">提示：保存后自动关闭，参数在下一局生效。</div>
    </div>
  </div>

  <!-- 开场面板 -->
  <div id="openOverlay" class="overlay">
    <div class="panel">
      <h1 style="font-size:20px;line-height:1.4;">英雄联盟S16全球总决赛队伍大逃杀</h1>
      <div class="coverWrap">
        <div class="coverTitle">WHO WILL WIN?</div>
        <canvas id="coverCanvas"></canvas>
        <button id="startBtn" class="bigBtn">开始比赛</button>
      </div>
    </div>
  </div>

  <!-- 结算面板 -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="panel">
      <div class="goldMedal"><div class="gm1">1</div><div class="gmTxt">GOLD</div></div>
      <div id="champName" class="champBig">TBD</div>
      <div id="champLine" class="champLine">恭喜 冠军 获得 英雄联盟S16全球总决赛总冠军</div>
      <div id="podium" class="podium"></div>
      <button id="againBtn" class="bigBtn">再来一局</button>
    </div>
  </div>
</div>

<script>/*! matter-js 0.20.0 (内嵌离线版) */

  /* ===== 场景搭建 ===== */
  function buildWorld() {
    // 提高求解迭代次数，减少高速球穿透（穿墙 BUG 修复）
    engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
    engine.gravity.y = 1;
    world = engine.world;

    createStatic();

    // 碰撞火花
    Events.on(engine, 'collisionStart', function (ev) {
      for (var i = 0; i < ev.pairs.length; i++) {
        var p = ev.pairs[i];
        var A = p.bodyA, B = p.bodyB;
        var sp = A.speed + B.speed;
        if (sp > 6 && p.collision && p.collision.supports && p.collision.supports.length) {
          var s = p.collision.supports[0];
          for (var k = 0; k < 2; k++) {
            particles.push({
              x: s.x, y: s.y,
              vx: (Math.random() - 0.5) * 130, vy: (Math.random() - 0.5) * 130 - 40,
              size: 1.5 + Math.random() * 2,
              rot: 0, vr: 0,
              life: 0.16 + Math.random() * 0.14, max: 1,
              color: Math.random() < 0.6 ? '#e8e4d8' : '#f5c518'
            });
          }
        }
      }
    });
  }

    floorBody = Bodies.rectangle((PLAT_X0 + PLAT_X1) / 2, PLAT_TOP + PLAT_H / 2, PLAT_X1 - PLAT_X0, PLAT_H, {

    poleL = Bodies.rectangle(LP_X0, poleY, POLE_LEN, POLE_TH, { isStatic: true, friction: 0.4, restitution: 0.5, label: 'pole' });
    poleR = Bodies.rectangle(RP_X0, poleY, POLE_LEN, POLE_TH, { isStatic: true, friction: 0.4, restitution: 0.5, label: 'pole' });

    var wallT = Bodies.rectangle(W / 2, -12, W, 32, { isStatic: true, friction: 0.3, restitution: 0.4, label: 'wall' });
    // 救援杆：初始在屏幕底部外侧，触发后升起

    lifterR.body = Bodies.rectangle(LIFTER_RX, H + 60, LIFTER_LEN, LIFTER_TH, { isStatic: true, friction: 0.8, restitution: 0.15, label: 'lifter' });

    rotL.body = Bodies.rectangle(ROT_LX, rotY, ROT_LEN, ROT_TH, { isStatic: true, friction: 0.5, restitution: 0.6, label: 'rotor' });

    World.add(world, [floorBody, poleL, poleR, wallL, wallR, wallT, lifterL.body, lifterR.body, rotL.body, rotR.body]);

  function rebuildStatic() {
    var all = Matter.Composite.allBodies(world);
    for (var i = all.length - 1; i >= 0; i--) {
      var lb = all[i].label;
      if (lb !== 'ball' && lb !== 'cage') World.remove(world, all[i]);
    }
    lifterL.active = false;
    lifterR.active = false;
    createStatic();
  }

  /* 把 SET 配置应用到全局生效参数（开局前调用） */
  function applySettings() {
    var half = (1000 - SET.plat.w) / 2;
    PLAT_X0 = half; PLAT_X1 = 1000 - half; PLAT_H = SET.plat.h;
    FALL_Y = PLAT_TOP + PLAT_H;
    POLE_LEN = SET.pole.len; POLE_YC = PLAT_TOP + 90;
    LP_X0 = PLAT_X0 + 30; LP_X1 = PLAT_X0 + 110;
    RP_X0 = PLAT_X1 - 110; RP_X1 = PLAT_X1 - 30;
    ROT_LEN = SET.rotor.len; ROT_SPD = SET.rotor.spd; ROT_Y = SET.rotor.y;
    LIFTER_LX = PLAT_X0 - 35; LIFTER_RX = PLAT_X1 + 25;
    lifterL.x = LIFTER_LX; lifterR.x = LIFTER_RX;
    poleLX = LP_X0; poleRX = RP_X0;
    rebuildStatic();
  }
  buildWorld();
  drawCoverIcons();

  /* ===== 开局封面：19 队图标矩阵 ===== */
  /* 封面专属旗面绘制（用传入的画布 context，避免画到主场景） */
  function coverFlag(g, x, y, r, nat) {
    var colors = nat.colors, R = r * 2, i;
    if (nat.pat === 'img') {
      var im = NatImg[nat.name];
      if (im && im.complete && im.naturalWidth > 0) {
        var sc = R / 0.86;
        g.drawImage(im, x - sc / 2, y - sc / 2, sc, sc);
      } else {
        g.fillStyle = colors[0] || '#888';
        g.fillRect(x - r, y - r, R, R);
      }
      return;   // 图片球已完整绘制
    }
    if (nat.pat === 'h') {
      var seg = R / colors.length;
      for (i = 0; i < colors.length; i++) { g.fillStyle = colors[i]; g.fillRect(x - r, y - r + i * seg, R, seg + 0.5); }
    } else if (nat.pat === 'v') {
      var segv = R / colors.length;
      for (i = 0; i < colors.length; i++) { g.fillStyle = colors[i]; g.fillRect(x - r + i * segv, y - r, segv + 0.5, R); }
    } else if (nat.pat === 'txt') {
      g.fillStyle = colors[0] || '#888';
      g.fillRect(x - r, y - r, R, R);
      g.fillStyle = nat.accent || '#FFFFFF';
      g.font = '800 ' + Math.max(8, Math.floor(r * 0.66)) + 'px Arial, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(nat.short || nat.name, x, y + 1);
      return;   // 文字图案已完整绘制，跳过下方 accent 图形
    } else {
      g.fillStyle = colors[0] || '#888';
      g.fillRect(x - r, y - r, R, R);
    }
    if (nat.accent && nat.pat !== 'h' && nat.pat !== 'v') {
      g.fillStyle = nat.accent;
      if (nat.pat === 'star') {
        g.beginPath();
        for (var k = 0; k < 5; k++) {
          var a = -Math.PI / 2 + k * (Math.PI * 2 / 5);
          var a2 = a + Math.PI / 5;
          var px = x + Math.cos(a) * r * 0.5, py = y + Math.sin(a) * r * 0.5;
          var px2 = x + Math.cos(a2) * r * 0.2, py2 = y + Math.sin(a2) * r * 0.2;
          if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
          g.lineTo(px2, py2);
        }
        g.closePath(); g.fill();
      } else if (nat.pat === 'circle') {
        g.beginPath(); g.arc(x, y, r * 0.4, 0, Math.PI * 2); g.fill();
      } else if (nat.pat === 'crescent') {
        g.beginPath(); g.arc(x - r * 0.1, y, r * 0.45, 0, Math.PI * 2); g.fill();
        g.fillStyle = colors[0] || '#888';
        g.beginPath(); g.arc(x + r * 0.1, y, r * 0.38, 0, Math.PI * 2); g.fill();
      } else if (nat.pat === 'cross') {
        g.fillRect(x - r * 0.08, y - r * 0.5, r * 0.16, r);
        g.fillRect(x - r * 0.5, y - r * 0.08, r, r * 0.16);
      } else {
        g.beginPath(); g.arc(x, y, r * 0.35, 0, Math.PI * 2); g.fill();
      }
    }
  }

  function drawCoverIcons() {
    var cv = document.getElementById('coverCanvas');
    if (!cv) return;
    // 自适应：宽度跟随视口，高度按行数撑起，避免滚动条
    var w = Math.round(Math.min(window.innerWidth * 0.92, 660));
    var cols = w >= 620 ? 8 : (w >= 430 ? 7 : 6);
    var rows = Math.ceil(NATIONS.length / cols);
    var cell = Math.floor(Math.min((w - 24) / cols, 92));
    var h = rows * cell + 24;
    cv.width = w; cv.height = h;
    var cctx = cv.getContext('2d');
    cctx.clearRect(0, 0, w, h);
    var pad = 12;
    var rr = cell * 0.36;
    for (var i = 0; i < NATIONS.length; i++) {
      var nat = NATIONS[i];
      var col = i % cols, row = Math.floor(i / cols);
      var x = pad + cell * (col + 0.5);
      var y = pad + cell * (row + 0.5);
      cctx.save();
      cctx.beginPath();
      cctx.arc(x, y, rr, 0, Math.PI * 2);
      cctx.clip();
      coverFlag(cctx, x, y, rr, nat);
      cctx.restore();
      cctx.strokeStyle = 'rgba(255,255,255,0.85)';
      cctx.lineWidth = 1.5;
      cctx.beginPath();
      cctx.arc(x, y, rr, 0, Math.PI * 2);
      cctx.stroke();
    }
  }
  window.addEventListener('resize', drawCoverIcons);

  /* ===== 游戏 BGM（Web Audio 合成循环旋律） ===== */
  var audioCtx = null, bgmTimer = null, bgmOn = false, bgmStep = 0;
  var BGM_NOTES = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33, 523.25, 440.00];
  var BGM_BASS = [130.81, 130.81, 146.83, 130.81, 130.81, 146.83, 196.00, 174.61];
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playBGM() {
    var ac = ensureAudio();
    if (!ac || bgmOn) return;
    bgmOn = true;
    bgmStep = 0;
    bgmTimer = setInterval(bgmTick, 300);
  }
  function stopBGM() {
    bgmOn = false;
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  }
  function bgmTick() {
    if (!audioCtx || !bgmOn) return;
    var t = audioCtx.currentTime + 0.02;
    var step = bgmStep % BGM_NOTES.length;
    playNote('square', BGM_NOTES[step], t, 0.26, 0.045);
    playNote('triangle', BGM_BASS[step], t, 0.42, 0.08);
    bgmStep++;
  }
  function playNote(type, freq, t, dur, vol) {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  /* 胜利号角：上升音阶 + 结尾和弦 */
  function playWinSound() {
    var ac = ensureAudio();
    if (!ac) return;
    var t = ac.currentTime + 0.02;
    var seq = [[523.25, 0], [659.25, 0.16], [783.99, 0.32], [1046.5, 0.5]];
    for (var i = 0; i < seq.length; i++) {
      playNote('square', seq[i][0], t + seq[i][1], 0.45, 0.09);
    }
    var chord = [523.25, 659.25, 783.99, 1046.5];
    for (var c = 0; c < chord.length; c++) {
      playNote('triangle', chord[c], t + 0.75, 1.0, 0.055);
    }
  }

  /* ===== 球生成（开局关在圈内） ===== */
  function spawnBalls() {
    clearBalls();
    for (var i = 0; i < NATIONS.length; i++) {
      var nat = NATIONS[i];
      var a = Math.random() * Math.PI * 2;
      var rr = Math.sqrt(Math.random()) * (CAGE_R - BALL_R * 2);
      var x = CAGE_CX + Math.cos(a) * rr;
      var y = CAGE_CY + Math.sin(a) * rr;
      var body = Bodies.circle(x, y, BALL_R, {
        density: 0.002, friction: 0.18, frictionAir: 0.0018,
        restitution: 0.51, label: 'ball'
      });
      World.add(world, body);
      balls.push({ n: nat.n, nation: nat, body: body, tail: [], dead: false });
    }
  }

  /* 开局圈：64 段矩形围成圆形边界（段间重叠，球出不去） */
  function buildCage() {
    removeCage();
    var n = 64;
    for (var i = 0; i < n; i++) {
      var a0 = (i / n) * Math.PI * 2;
      var a1 = ((i + 1) / n) * Math.PI * 2;
      var am = (a0 + a1) / 2;
      var len = 2 * CAGE_R * Math.sin(Math.PI / n) + 16;   // 加长使相邻段重叠
      var mx = CAGE_CX + Math.cos(am) * CAGE_R;
      var my = CAGE_CY + Math.sin(am) * CAGE_R;
      var seg = Bodies.rectangle(mx, my, len, 18, {
        angle: am, isStatic: true, friction: 0.3, restitution: 0.4, label: 'cage'
      });
      cageBodies.push(seg);
      World.add(world, seg);
    }
  }

  function removeCage() {
    for (var i = 0; i < cageBodies.length; i++) {
      if (cageBodies[i]) World.remove(world, cageBodies[i]);
    }
    cageBodies = [];
  }

  function clearBalls() {
    for (var i = 0; i < balls.length; i++) {
      if (balls[i].body) World.remove(world, balls[i].body);
    }
    balls = [];
    particles = [];
    elimOrder = [];
  }

  function aliveBalls() {
    return balls.filter(function (b) { return b.body; });
  }
  /* 存活的本体球（不含分身）——决定名次与冠军 */
  function aliveReal() {
    return balls.filter(function (b) { return b.body && !b.isClone; });
  }
  /* 场上所有球（含分身）是否只剩同一个国家；返回该国家或 null */
  function allSameNation() {
    var alive = aliveBalls();
    if (alive.length === 0) return null;
    var first = alive[0].nation;
    for (var i = 1; i < alive.length; i++) {
      if (alive[i].nation !== first) return null;
    }
    return first;
  }

  /* ===== 排名栏：19 个名次圈（空心圆），左 10 右 9 ===== */
  function renderRank() {
    var lh = '', rh = '';
    for (var i = 0; i < NATIONS.length; i++) {
      var rankNum = i + 1;   // 名次位：1=冠军 … 19=最先淘汰
      var el = '<div class="rk waiting" id="rk' + rankNum + '">' + rankNum + '</div>';
      if (i < 10) lh += el; else rh += el;   // 左 10 个名次圈，右 9 个
    }
    rankLeft.innerHTML = lh;
    rankRight.innerHTML = rh;
  }
  function findBall(n) {
    // 只看本体球（分身不参与排行榜与名次）
    for (var i = 0; i < balls.length; i++) if (balls[i].n === n && balls[i].body && !balls[i].isClone) return balls[i];
    return null;
  }
  /* 第 k 个淘汰 → 名次 = 20 - k：该国队标球写入对应名次圈并点亮为红 */
  function markElim(n, rankNum, nation) {
    var el = document.getElementById('rk' + rankNum);
    if (!el) return;
    el.className = 'rk dead';
    el.innerHTML = '';
    var cv = document.createElement('canvas');
    cv.width = 20; cv.height = 20;
    var g = cv.getContext('2d');
    g.save();
    g.beginPath();
    g.arc(10, 10, 9, 0, Math.PI * 2);
    g.clip();
    coverFlag(g, 10, 10, 9, nation);
    g.restore();
    g.beginPath();
    g.arc(10, 10, 9, 0, Math.PI * 2);
    g.strokeStyle = 'rgba(255,255,255,0.9)';
    g.lineWidth = 1;
    g.stroke();
    el.appendChild(cv);
  }
  function markChamp(n, nation) {
    var el = document.getElementById('rk1');
    if (!el) return;
    el.className = 'rk champ';
    el.innerHTML = '';
    var cv = document.createElement('canvas');
    cv.width = 20; cv.height = 20;
    var g = cv.getContext('2d');
    g.save();
    g.beginPath();
    g.arc(10, 10, 9, 0, Math.PI * 2);
    g.clip();
    coverFlag(g, 10, 10, 9, nation);
    g.restore();
    g.beginPath();
    g.arc(10, 10, 9, 0, Math.PI * 2);
    g.strokeStyle = '#f5c518';
    g.lineWidth = 1.5;
    g.stroke();
    el.appendChild(cv);
  }

  /* ===== 淘汰 ===== */
  function eliminate(ball) {
    var b = ball.body;
    var cx = b.position.x, cy = b.position.y;
    World.remove(world, b);
    ball.body = null;
    ball.dead = true;
    var main = ball.nation.colors[0] || '#888';
    var accent = ball.nation.accent || main;
    // 主体碎片
    for (var i = 0; i < 16; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 70 + Math.random() * 180;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 90,
        size: 2.5 + Math.random() * 5,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 12,
        life: 0.4 + Math.random() * 0.45, max: 1,
        color: Math.random() < 0.6 ? accent : (Math.random() < 0.5 ? main : '#ff6b35')
      });
    }
    // 岩浆溅射（在台面下沿附近）
    for (var j = 0; j < 10; j++) {
      particles.push({
        x: cx, y: PLAT_TOP + PLAT_H - 12 + Math.random() * 12,
        vx: (Math.random() - 0.5) * 130, vy: -50 - Math.random() * 150,
        size: 2 + Math.random() * 4,
        rot: 0, vr: 0,
        life: 0.28 + Math.random() * 0.32, max: 1,
        color: Math.random() < 0.5 ? '#ff6b35' : '#ff3b1f'
      });
    }
    // 分裂规则：该国所有球（母体+全部分身）都消失才算淘汰，才进名次圈
    var nationStillAlive = false;
    for (var s = 0; s < balls.length; s++) {
      var ob = balls[s];
      if (ob !== ball && ob.nation.n === ball.nation.n && ob.body) { nationStillAlive = true; break; }
    }
    if (!nationStillAlive) {
      // 去重：同一国家只入榜一次（防止分身/母体先后淘汰导致重复写入）
      var already = false;
      for (var e = 0; e < elimOrder.length; e++) if (elimOrder[e].n === ball.nation.n) { already = true; break; }
      if (!already) {
        elimOrder.push(ball.nation);
        var rn = 20 - elimOrder.length;        // 第 k 个淘汰 → 名次圈 20-k
        if (rn < 2) rn = 2;                    // 圈号保护：不覆盖冠军圈 rk1
        markElim(ball.n, rn, ball.nation);
      }
    }
    updateTotal();
  }

  function updateTotal() {
    totalNum.textContent = aliveBalls().length;
  }

  function fmtTime(t) {
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function updateTimer() {
    if (gameTimer) gameTimer.textContent = fmtTime(timerSec);
  }

  /* ===== 开始 / 重开 ===== */
  function startMatch() {
    openOverlay.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    applySettings();   // 设置下一局生效
    spawnBalls();
    buildCage();
    gameState = 'intro';
    acc = 0;
    timerSec = 0;
    updateTimer();
    fhTimer = 6;
    paused = false;
    pauseMask.classList.add('hidden');
    pauseBtn.textContent = '暂停';
    renderRank();
    updateTotal();
    playBGM();
    if (!rafId) { lastTime = 0; rafId = requestAnimationFrame(loop); }
  }

  function restartMatch() {
    paused = false;
    pauseMask.classList.add('hidden');
    resultOverlay.classList.add('hidden');
    applySettings();   // 设置下一局生效
    spawnBalls();
    buildCage();
    gameState = 'intro';
    acc = 0;
    fhTimer = 6;
    pauseBtn.textContent = '暂停';
    renderRank();
    updateTotal();
    playBGM();
    if (!rafId) { lastTime = 0; rafId = requestAnimationFrame(loop); }
  }

  /* ===== 结算 ===== */
  function finishMatch(winner) {
    championMap[winner.name] = (championMap[winner.name] || 0) + 1;
    saveStats();
    playWinSound();   // 结算胜利音效

    champName.textContent = winner.name;
    champName.style.color = '#f5c518';
    champLine.innerHTML = '恭喜 <span class="cn">' + winner.name + '</span> 获得 英雄联盟S16全球总决赛总冠军';

    var podium = [{ role: '冠军', name: winner.name }];
    if (elimOrder.length >= 1) podium.push({ role: '亚军', name: elimOrder[elimOrder.length - 1].name });
    if (elimOrder.length >= 2) podium.push({ role: '季军', name: elimOrder[elimOrder.length - 2].name });
    var phtml = '';
    for (var i = 0; i < podium.length; i++) {
      phtml += '<div class="p">' + podium[i].role + '<span class="n">' + podium[i].name + '</span></div>';
    }
    podiumEl.innerHTML = phtml;

    markChamp(winner.n, winner);
    gameState = 'over';
    resultOverlay.classList.remove('hidden');
    stopBGM();   // 结算停止 BGM，烟花庆祝
  }

  /* ===== 渲染：背景 ===== */
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, canvas.height);
    g.addColorStop(0, '#181b20');
    g.addColorStop(1, '#0e1014');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 棋盘格
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    var cs = 40;
    for (var x = 0; x < W; x += cs) {
      ctx.beginPath(); ctx.moveTo(sx(x), 0); ctx.lineTo(sx(x), canvas.height); ctx.stroke();
    }
    for (var y = 0; y < H; y += cs) {
      ctx.beginPath(); ctx.moveTo(0, sy(y)); ctx.lineTo(canvas.width, sy(y)); ctx.stroke();
    }
  }

  /* ===== 渲染：平台 ===== */
  function drawPlatform() {
    var x0 = sx(PLAT_X0), x1 = sx(PLAT_X1), y0 = sy(PLAT_TOP), y1 = sy(PLAT_TOP + PLAT_H);
    var g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, '#c8c2b6');
    g.addColorStop(0.45, '#a9a397');
    g.addColorStop(1, '#7e7a70');
    ctx.fillStyle = g;
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(x0, y0, x1 - x0, 3);
    // 台面纹理
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    for (var i = 0; i < 30; i++) {
      ctx.fillRect(x0 + Math.random() * (x1 - x0), y0 + 8 + Math.random() * (y1 - y0 - 14), 2, 2);
    }
    // 边缘警示线
    ctx.fillStyle = 'rgba(245,197,24,0.55)';
    ctx.fillRect(x0, y1 - 4, x1 - x0, 4);
  }

  /* ===== 渲染：岩浆 ===== */
  function drawLava() {
    var top = PLAT_TOP + PLAT_H;
    var y0 = sy(top), h = canvas.height - y0;
    var g = ctx.createLinearGradient(0, y0, 0, canvas.height);
    g.addColorStop(0, '#ff6a1f');
    g.addColorStop(0.25, '#e83a12');
    g.addColorStop(1, '#5c0e06');
    ctx.fillStyle = g;
    ctx.fillRect(0, y0, canvas.width, h);

    // 岩浆波动
    ctx.fillStyle = 'rgba(255,190,60,0.75)';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (var x = 0; x <= canvas.width; x += 8) {
      var lx = x / canvas.width * W;
      var wave = Math.sin(lx / 34 + time * 3.2) * 3 + Math.sin(lx / 15 + time * 5.1) * 2;
      ctx.lineTo(x, y0 + sy(wave + 5));
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,240,180,0.5)';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (var x2 = 0; x2 <= canvas.width; x2 += 8) {
      var lx2 = x2 / canvas.width * W;
      var w2 = Math.sin(lx2 / 27 + time * 4.6) * 2.4;
      ctx.lineTo(x2, y0 + sy(w2 + 3));
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.closePath();
    ctx.fill();
  }

  /* ===== 渲染：横躺柱子 ===== */
  function drawPole(x) {
    var px = sx(x - POLE_LEN / 2);
    var py = sy(POLE_YC - POLE_TH / 2);
    var pw = sx(POLE_LEN), ph = sy(POLE_TH);
    var g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, '#63d97f');
    g.addColorStop(0.5, '#3fbf63');
    g.addColorStop(1, '#1f8a3d');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(px, py, pw, ph, 6); }
    else { ctx.rect(px, py, pw, ph); }
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(px + 4, py + 2, pw - 8, ph * 0.4);
    // 两端深色端帽
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(px + 2, py + 2, 8, ph - 4);
    ctx.fillRect(px + pw - 10, py + 2, 8, ph - 4);
  }

  /* ===== 渲染：球（旗面） ===== */
  function drawBall(ball) {
    var b = ball.body;
    var x = sx(b.position.x), y = sy(b.position.y);
    var r = sx(BALL_R);
    var nat = ball.nation;
    var main = nat.colors[0] || '#888';

    // 拖尾
    for (var t = 0; t < ball.tail.length; t++) {
      var tp = ball.tail[t];
      ctx.globalAlpha = (t + 1) / ball.tail.length * 0.26;
      ctx.fillStyle = main;
      ctx.beginPath();
      ctx.arc(sx(tp.x), sy(tp.y), r * (0.35 + 0.65 * t / ball.tail.length), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.arc(x + 2, y + 3, r, 0, Math.PI * 2);
    ctx.fill();

    // 旗面（球内圆形裁切）
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    drawFlagSurface(x, y, r, nat);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.32, y - r * 0.45, r * 0.5, r * 0.3, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 白描边
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawFlagSurface(x, y, r, nat) {
    var colors = nat.colors;
    var R = r * 2;
    if (nat.pat === 'img') {
      var im = NatImg[nat.name];
      if (im && im.complete && im.naturalWidth > 0) {
        // 队标球图片：球体占画布 86%，放大绘制使球体正好填满 r，白环落在圆边上
        var sc = R / 0.86;
        ctx.drawImage(im, x - sc / 2, y - sc / 2, sc, sc);
      } else {
        ctx.fillStyle = colors[0] || '#888';
        ctx.fillRect(x - r, y - r, R, R);
      }
      return;   // 图片球自带白描边与高光，跳过下方通用描边
    }
    switch (nat.pat) {
      case 'h': {
        var seg = R / colors.length;
        for (var i = 0; i < colors.length; i++) {
          ctx.fillStyle = colors[i];
          ctx.fillRect(x - r, y - r + i * seg, R, seg + 0.5);
        }
        break;
      }
      case 'v': {
        var segv = R / colors.length;
        for (var j = 0; j < colors.length; j++) {
          ctx.fillStyle = colors[j];
          ctx.fillRect(x - r + j * segv, y - r, segv + 0.5, R);
        }
        break;
      }
      case 'star': {
        ctx.fillStyle = colors[0];
        ctx.fillRect(x - r, y - r, R, R);
        ctx.fillStyle = nat.accent;
        drawStar(x, y, r * 0.55, r * 0.22);
        break;
      }
      case 'circle': {
        ctx.fillStyle = colors[0];
        ctx.fillRect(x - r, y - r, R, R);
        ctx.fillStyle = nat.accent;
        ctx.beginPath();
        ctx.arc(x, y, r * 0.42, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case 'crescent': {
        ctx.fillStyle = colors[0];
        ctx.fillRect(x - r, y - r, R, R);
        ctx.fillStyle = nat.accent;
        ctx.beginPath();
        ctx.arc(x - r * 0.12, y, r * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = colors[0];
        ctx.beginPath();
        ctx.arc(x + r * 0.18, y, r * 0.42, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = nat.accent;
        drawStar(x + r * 0.45, y - r * 0.2, r * 0.14, r * 0.06);
        break;
      }
      case 'cross': {
        ctx.fillStyle = colors[0];
        ctx.fillRect(x - r, y - r, R, R);
        ctx.fillStyle = nat.accent;
        ctx.fillRect(x - r * 0.55, y - r * 0.18, r * 1.1, r * 0.36);
        ctx.fillRect(x - r * 0.18, y - r * 0.55, r * 0.36, r * 1.1);
        break;
      }
      case 'txt': {
        ctx.fillStyle = colors[0] || '#888';
        ctx.fillRect(x - r, y - r, R, R);
        ctx.fillStyle = nat.accent || '#FFFFFF';
        ctx.font = '800 ' + Math.max(9, Math.floor(r * 0.62)) + 'px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(nat.short || nat.name, x, y + 1);
        break;
      }
      default: {
        ctx.fillStyle = colors[0];
        ctx.fillRect(x - r, y - r, R, R);
      }
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawStar(cx, cy, outer, inner) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = i % 2 === 0 ? outer : inner;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = cx + Math.cos(a) * rad;
      var py = cy + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = Math.max(0, p.life / p.max);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(sx(p.x), sy(p.y));
      ctx.rotate(p.rot || 0);
      var s = p.size * (canvas.width / W);
      ctx.fillStyle = p.color;
      if (p.shape === 'dot') {
        ctx.beginPath();
        ctx.arc(0, 0, s / 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === 'confetti') {
        ctx.fillRect(-s * 0.9, -s * 0.28, s * 1.8, s * 0.56);
      } else {
        ctx.fillRect(-s / 2, -s / 2, s, s);
      }
      ctx.restore();
    }
  }

  /* ===== 结算庆祝：烟花 + 飘落彩带 ===== */
  var fireworkTimer = 0.3;
  var CONF_COLORS = ['#f5c518', '#ff6b6b', '#4fc3f7', '#7ef0a0', '#e8e4d8', '#ff9f43', '#c9a7e8'];
  function celebrate(sdt) {
    // 彩带持续飘落
    for (var i = 0; i < 2; i++) {
      particles.push({
        x: Math.random() * W, y: -10 - Math.random() * 60,
        vx: (Math.random() - 0.5) * 30, vy: 40 + Math.random() * 70,
        size: 5 + Math.random() * 5, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 8,
        life: 2.4, max: 2.4,
        color: CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)],
        shape: 'confetti'
      });
    }
    // 烟花每隔 0.45s 炸一发
    fireworkTimer -= sdt;
    if (fireworkTimer <= 0) {
      fireworkTimer = 0.45;
      var fx = 90 + Math.random() * (W - 180);
      var fy = 70 + Math.random() * 220;
      var hue = CONF_COLORS[Math.floor(Math.random() * CONF_COLORS.length)];
      for (var k = 0; k < 28; k++) {
        var a = (k / 28) * Math.PI * 2 + Math.random() * 0.25;
        var sp = 45 + Math.random() * 95;
        particles.push({
          x: fx, y: fy,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          size: 2 + Math.random() * 2.5, rot: 0, vr: 0,
          life: 0.7 + Math.random() * 0.45, max: 1.15,
          color: hue, shape: 'dot'
        });
      }
    }
  }

  /* ===== 主循环 ===== */
  function loop(now) {
    if (!lastTime) lastTime = now;
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    var sdt = dt * speed;
    time += sdt;
    if (gameState === 'intro' || gameState === 'running') { timerSec += sdt; updateTimer(); }

    if (gameState === 'intro') {
      Engine.update(engine, dt * 1000 * speed);
      wander();
      movePoles(sdt);
      updateRotors(sdt);   // 旋转杆开局即生效
      acc += sdt;
      if (acc >= INTRO_T) {
        removeCage();
        gameState = 'running';
      }
    } else if (gameState === 'running') {
      Engine.update(engine, dt * 1000 * speed);
      clampBalls();
      wander();
      movePoles(sdt);
      updateRotors(sdt);
      updateLifters(sdt);   // 救援杆：勾选左下角开关才启用
      channelPush(sdt);
      splitBall(sdt);
      surfacePop(sdt);
      checkFalling();
      fateHand(sdt);
    } else if (gameState === 'champion') {
      // 画面冻结：物理不再更新，球保持原位，倒数后揭晓冠军（冠军诞生即放烟花）
      celebrate(sdt);
      champTimer -= sdt;
      if (champTimer <= 0) {
        var alive = aliveBalls();
        finishMatch(alive.length >= 1 ? alive[0].nation : { n: 1, name: '神秘球' });
      }
    } else {
      if (gameState === 'over') {
        celebrate(sdt);   // 结算庆祝：烟花 + 彩带
      } else {
        Engine.update(engine, dt * 1000 * speed);
      }
      clampBalls();
    }

    updateParticles(sdt);
    render();
    rafId = requestAnimationFrame(loop);
  }

  /* 球随机游走 + 拖尾采样（低速蠕动） */
  function wander() {
    var alive = aliveBalls();
    for (var i = 0; i < alive.length; i++) {
      var b = alive[i].body;
      if (Math.random() < 0.09) {
        var a = Math.random() * Math.PI * 2;
        Body.setVelocity(b, {
          x: b.velocity.x * 0.5 + Math.cos(a) * 6.5,
          y: b.velocity.y * 0.5 + Math.sin(a) * 6.5
        });
      }
      alive[i].tail.push({ x: b.position.x, y: b.position.y });
      if (alive[i].tail.length > 24) alive[i].tail.shift();
    }
  }

  /* 旋转杆：左右反向匀速旋转 */
  function updateRotors(sdt) {
    if (!SET.rotor.enabled) return;
    rotL.angle += ROT_SPD * sdt;
    rotR.angle -= ROT_SPD * sdt;
    Body.setAngle(rotL.body, rotL.angle);
    Body.setAngle(rotR.body, rotR.angle);
  }

  /* 球体分裂：随机一段时间，一个存活的球克隆出分身 */
  function splitBall(sdt) {
    splitTimer -= sdt;
    if (splitTimer > 0) return;
    splitTimer = SET.breed.min + Math.random() * (SET.breed.max - SET.breed.min);   // 繁殖速度（可调）
    var alive = aliveBalls();
    if (alive.length >= MAX_BALLS || alive.length < 2) return;
    var src = alive[Math.floor(Math.random() * alive.length)];
    var p = src.body.position;
    var a = Math.random() * Math.PI * 2;
    var nx = Math.max(BALL_R + 4, Math.min(W - BALL_R - 4, p.x + Math.cos(a) * (BALL_R * 2 + 6)));
    var ny = Math.max(BALL_R + 4, Math.min(H - BALL_R - 4, p.y + Math.sin(a) * (BALL_R * 2 + 6)));
    var body = Bodies.circle(nx, ny, BALL_R, {
      density: 0.002, friction: 0.18, frictionAir: 0.0018,
      restitution: 0.51, label: 'ball'
    });
    Body.setVelocity(body, { x: Math.cos(a) * 3, y: -2 });
    World.add(world, body);
    balls.push({ n: src.n, nation: src.nation, body: body, tail: [], dead: false, isClone: true });
    // 分裂特效
    for (var k = 0; k < 10; k++) {
      particles.push({
        x: nx, y: ny,
        vx: (Math.random() - 0.5) * 130, vy: (Math.random() - 0.5) * 130 - 30,
        size: 2 + Math.random() * 3, rot: 0, vr: 0,
        life: 0.3 + Math.random() * 0.3, max: 1,
        color: Math.random() < 0.5 ? '#7ef0a0' : '#f5c518'
      });
    }
  }

  /* 高速球防穿墙铁闸：位置一旦越过屏幕边界，立即拉回并削弱向外速度；同时限制球速上限防数值爆炸 */
  var MAX_BALL_SPD = 90;
  function clampBalls() {
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (!b.body) continue;
      var p = b.body.position;
      var nx = p.x, ny = p.y, moved = false;
      if (p.x < BALL_R) { nx = BALL_R; moved = true; }
      if (p.x > W - BALL_R) { nx = W - BALL_R; moved = true; }
      if (p.y < BALL_R) { ny = BALL_R; moved = true; }
      if (moved) {
        Body.setPosition(b.body, { x: nx, y: ny });
        var v = b.body.velocity;
        Body.setVelocity(b.body, { x: v.x * 0.6, y: v.y * 0.6 });
      }
      var v2 = b.body.velocity;
      var spd = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
      if (spd > MAX_BALL_SPD) {
        var k = MAX_BALL_SPD / spd;
        Body.setVelocity(b.body, { x: v2.x * k, y: v2.y * k });
      }
    }
  }

  /* 台面弹性脉冲：每1~3秒在平台表面随机位置喷一次向上的力，把球弹起 */
  var popTimer = 2;
  function surfacePop(sdt) {
    popTimer -= sdt;
    if (popTimer > 0) return;
    popTimer = 1 + Math.random() * 2;
    var px = PLAT_X0 + 40 + Math.random() * (PLAT_X1 - PLAT_X0 - 80);
    // 喷气特效
    for (var k = 0; k < 8; k++) {
      particles.push({
        x: px + (Math.random() - 0.5) * 50, y: PLAT_TOP - 6 + Math.random() * 8,
        vx: (Math.random() - 0.5) * 30, vy: -80 - Math.random() * 60,
        size: 2 + Math.random() * 3, rot: 0, vr: 0,
        life: 0.25 + Math.random() * 0.2, max: 1,
        color: Math.random() < 0.5 ? '#8ef0c0' : '#ffffff'
      });
    }
    // 弹起喷点附近的球
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (!b.body) continue;
      var p = b.body.position;
      var dx = p.x - px;
      if (Math.abs(dx) < 45 && p.y > PLAT_TOP - 60 && p.y < PLAT_TOP + 30) {
        var v = b.body.velocity;
        Body.setVelocity(b.body, { x: v.x * 0.8, y: v.y * 0.5 - 65 });
      }
    }
  }

  /* 方案2：通道定向推力——每2~4秒把已掉出平台、还卡在通道里的球朝平台方向推回去 */
  function channelPush(sdt) {
    pushTimer -= sdt;
    if (pushTimer > 0) return;
    pushTimer = 2 + Math.random() * 2;
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (!b.body || b.dead) continue;
      var p = b.body.position;
      if (p.y > PLAT_TOP - 30 && (p.x < PLAT_X0 || p.x > PLAT_X1)) {
        var dir = p.x < (PLAT_X0 + PLAT_X1) / 2 ? 1 : -1;
        Body.setVelocity(b.body, { x: dir * 11, y: -8 });
      }
    }
  }

  /* 救援杆：随机倒计时触发，从屏幕底外匀速升到屏幕顶外 */
  function updateLifters(sdt) {
    var on = SET.lifter.enabled;
    // 决赛圈自动开启：场上只剩 ≤2 个不同队伍时，强制开救援杆
    if (!on && SET.lifter.finale) {
      var seen = {};
      var al = aliveBalls();
      for (var i = 0; i < al.length; i++) seen[al[i].nation.n] = 1;
      if (Object.keys(seen).length <= 2) on = true;
    }
    if (!on) return;
    var arr = [lifterL, lifterR];
    for (var i = 0; i < arr.length; i++) {
      var lf = arr[i];
      if (!lf.active) {
        lf.cd -= sdt;
        if (lf.cd <= 0) {
          lf.active = true;
          lf.y = H + 60;
          Body.setPosition(lf.body, { x: lf.x, y: lf.y });
        }
      } else {
        lf.y -= LIFTER_SPD * sdt;
        Body.setPosition(lf.body, { x: lf.x, y: lf.y });
        if (lf.y < -80) {
          lf.active = false;
          lf.cd = SET.lifter.min + Math.random() * (SET.lifter.max - SET.lifter.min);   // 救援杆频率
        }
      }
    }
  }

  /* 柱子横向往复扫动（速度倍率：默认 3 即三倍速） */
  function movePoles(sdt) {
    if (!SET.pole.enabled) return;
    var halfPeriod = 0.5 / SET.pole.speed;   // 半个来回所需秒数
    var lp = 0.5 + 0.5 * Math.sin(time * (Math.PI * 2 / halfPeriod));
    var rp = 0.5 + 0.5 * Math.sin(time * (Math.PI * 2 / halfPeriod) + 1.9);
    poleLX = LP_X0 + (LP_X1 - LP_X0) * lp;
    poleRX = RP_X0 + (RP_X1 - RP_X0) * rp;
    Body.setPosition(poleL, { x: poleLX, y: POLE_YC });
    Body.setPosition(poleR, { x: poleRX, y: POLE_YC });
  }

  /* 掉落判定：掉进岩浆 / 飞出屏幕两侧 / 卡到天上 都算淘汰。
     场上剩 2 球时，第二个一掉岩浆立即冻结画面，避免冠军也掉下去 */
  function checkFalling() {
    for (var i = balls.length - 1; i >= 0; i--) {
      var b = balls[i];
      if (!b.body) continue;
      var p = b.body.position;
      if (p.y - BALL_R > FALL_Y || p.x < -120 || p.x > W + 120 || p.y < -420) {
        eliminate(b);
        // 场上只剩同一个国家的球（含分身）时，比赛结束
        if (allSameNation()) {
          gameState = 'champion';
          champTimer = 2.2;
          return;
        }
      }
    }
  }

  /* 命运之手：隔段时间随机推一把，保证比赛推进（决胜阶段不打扰） */
  function fateHand(sdt) {
    fhTimer -= sdt;
    if (fhTimer <= 0) {
      fhTimer = 5.5 + Math.random() * 4;
      var alive = aliveBalls();
      if (alive.length < 3) return;
      var pick = alive[Math.floor(Math.random() * alive.length)];
      var a = Math.random() * Math.PI * 2;
      Body.setVelocity(pick.body, {
        x: pick.body.velocity.x * 0.3 + Math.cos(a) * 23.5,
        y: pick.body.velocity.y * 0.3 + Math.sin(a) * 23.5
      });
      particles.push({
        x: pick.body.position.x, y: pick.body.position.y - BALL_R,
        vx: 0, vy: -30, size: 5, rot: 0, vr: 0,
        life: 0.25, max: 1, color: '#ffffff'
      });
    }
  }

  /* ===== 渲染入口 ===== */
  function updateParticles(sdt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= sdt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * sdt;
      p.y += p.vy * sdt;
      p.vy += 480 * sdt;
      p.rot += p.vr * sdt;
    }
  }

  /* 屏幕四周金属框（对应碰撞墙） */
  function drawFrame() {
    ctx.strokeStyle = 'rgba(122,130,142,0.55)';
    ctx.lineWidth = sx(12);
    ctx.strokeRect(sx(6), sy(6), canvas.width - sx(12), canvas.height - sy(12));
    ctx.fillStyle = 'rgba(34,38,44,0.92)';
    ctx.fillRect(0, 0, canvas.width, sy(5));
    ctx.fillStyle = 'rgba(245,197,24,0.22)';
    ctx.fillRect(0, 0, canvas.width, sy(2));
  }

  /* ===== 渲染：救援杆（从底部升起的橙黄横条） ===== */
  function drawLifter(lf) {
    if (!lf.active) return;
    var px = sx(lf.x - LIFTER_LEN / 2);
    var py = sy(lf.y - LIFTER_TH / 2);
    var pw = sx(LIFTER_LEN), ph = sy(LIFTER_TH);
    var g = ctx.createLinearGradient(0, py, 0, py + ph);
    g.addColorStop(0, '#ffd23f');
    g.addColorStop(0.5, '#f5a623');
    g.addColorStop(1, '#d97b0f');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(px, py, pw, ph, 6); }
    else { ctx.rect(px, py, pw, ph); }
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(px + 4, py + 2, pw - 8, ph * 0.35);
  }

  /* ===== 渲染入口 ===== */
  /* ===== 渲染：旋转杆 ===== */
  function drawRotor(r) {
    ctx.save();
    ctx.translate(sx(r.body.position.x), sy(r.body.position.y));
    ctx.rotate(r.body.angle);
    ctx.fillStyle = 'rgba(90,205,130,0.92)';
    ctx.fillRect(-sx(ROT_LEN / 2), -sy(ROT_TH / 2), sx(ROT_LEN), sy(ROT_TH));
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-sx(ROT_LEN / 2), -sy(ROT_TH / 2), sx(ROT_LEN), sy(ROT_TH));
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-sx(ROT_LEN / 2) + 3, -sy(ROT_TH / 2) + 2, sx(ROT_LEN) - 6, sy(ROT_TH) * 0.4);
    // 轴心
    ctx.fillStyle = '#1f8a3d';
    ctx.beginPath();
    ctx.arc(0, 0, sx(9), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ===== 渲染：开局圈（转盘）与倒计时 ===== */
  function drawCage() {
    if (gameState !== 'intro') return;
    ctx.save();
    ctx.translate(sx(CAGE_CX), sy(CAGE_CY));
    // 外环
    ctx.strokeStyle = 'rgba(245,197,24,0.9)';
    ctx.lineWidth = sx(6);
    ctx.beginPath();
    ctx.arc(0, 0, sx(CAGE_R), 0, Math.PI * 2);
    ctx.stroke();
    // 扇区分割线（8 段）
    ctx.strokeStyle = 'rgba(245,197,24,0.35)';
    ctx.lineWidth = sx(2);
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * sx(CAGE_R), Math.sin(a) * sx(CAGE_R));
      ctx.stroke();
    }
    // 中心转轴
    ctx.fillStyle = '#1f8a3d';
    ctx.beginPath();
    ctx.arc(0, 0, sx(12), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawCountdown() {
    if (gameState !== 'intro') return;
    var remain = Math.ceil(INTRO_T - acc);
    if (remain < 1) remain = 1;
    ctx.save();
    ctx.font = '900 ' + sy(96) + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = sy(18);
    ctx.fillStyle = '#f5c518';
    ctx.fillText(String(remain), canvas.width / 2, sy(CAGE_CY) - sy(120));
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawPlatform();
    drawLava();
    drawCage();
    drawPole(poleLX);
    drawPole(poleRX);
    drawRotor(rotL);
    drawRotor(rotR);
    drawLifter(lifterL);
    drawLifter(lifterR);
    for (var i = 0; i < balls.length; i++) if (balls[i].body) drawBall(balls[i]);
    drawParticles();
    drawCountdown();
    drawFrame();
  }

  /* ===== 暂停 ===== */
  function setPaused(v) {
    if (v === paused) return;
    paused = v;
    if (paused) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      stopBGM();
      pauseMask.classList.remove('hidden');
      pauseBtn.textContent = '继续';
    } else {
      lastTime = 0;
      pauseMask.classList.add('hidden');
      pauseBtn.textContent = '暂停';
      playBGM();
      rafId = requestAnimationFrame(loop);
    }
  }
  function togglePause() {
    if (gameState === 'idle' || gameState === 'over') return;
    setPaused(!paused);
  }

  /* ===== 设置面板 ===== */
  var settingsBtn = document.getElementById('settingsBtn');
  var settingsOverlay = document.getElementById('settingsOverlay');
  function openSettings() {
    document.getElementById('setLifterOn').checked = SET.lifter.enabled;
    document.getElementById('setLifterFinale').checked = SET.lifter.finale;
    document.getElementById('setLifterMin').value = SET.lifter.min;
    document.getElementById('setLifterMax').value = SET.lifter.max;
    document.getElementById('setPoleOn').checked = SET.pole.enabled;
    document.getElementById('setPoleLen').value = SET.pole.len;
    document.getElementById('setPoleSpd').value = SET.pole.speed;
    document.getElementById('setRotOn').checked = SET.rotor.enabled;
    document.getElementById('setRotSpd').value = Math.round(SET.rotor.spd * 57.3);
    document.getElementById('setRotLen').value = SET.rotor.len;
    document.getElementById('setRotY').value = SET.rotor.y;
    document.getElementById('setPlatW').value = SET.plat.w;
    document.getElementById('setPlatH').value = SET.plat.h;
    document.getElementById('setBreedMin').value = SET.breed.min;
    document.getElementById('setBreedMax').value = SET.breed.max;
    settingsOverlay.classList.remove('hidden');
  }
  function saveSettings() {
    SET.lifter.enabled = document.getElementById('setLifterOn').checked;
    SET.lifter.finale = document.getElementById('setLifterFinale').checked;
    SET.lifter.min = Math.max(0.5, parseFloat(document.getElementById('setLifterMin').value) || 1);
    SET.lifter.max = Math.max(SET.lifter.min, parseFloat(document.getElementById('setLifterMax').value) || 3);
    SET.pole.enabled = document.getElementById('setPoleOn').checked;
    SET.pole.len = Math.max(60, parseFloat(document.getElementById('setPoleLen').value) || 180);
    SET.pole.speed = Math.max(0.5, parseFloat(document.getElementById('setPoleSpd').value) || 3);
    SET.rotor.enabled = document.getElementById('setRotOn').checked;
    SET.rotor.spd = Math.max(0, (parseFloat(document.getElementById('setRotSpd').value) || 115) / 57.3);
    SET.rotor.len = Math.max(40, parseFloat(document.getElementById('setRotLen').value) || 100);
    SET.rotor.y = Math.max(200, parseFloat(document.getElementById('setRotY').value) || 250);
    SET.plat.w = Math.min(1000, Math.max(600, parseFloat(document.getElementById('setPlatW').value) || 780));
    SET.plat.h = Math.min(300, Math.max(120, parseFloat(document.getElementById('setPlatH').value) || 180));
    SET.breed.min = Math.max(0.5, parseFloat(document.getElementById('setBreedMin').value) || 2);
    SET.breed.max = Math.max(SET.breed.min, parseFloat(document.getElementById('setBreedMax').value) || 7);
    saveSet();
    settingsOverlay.classList.add('hidden');
  }
  function resetSettings() {
    SET = {
      lifter: { enabled: true, finale: false, min: 1, max: 3 },
      pole:   { enabled: true, len: 180, speed: 3.0 },
      rotor:  { enabled: true, len: 100, spd: 2.0, y: 250 },
      plat:   { w: 780, h: 180 },
      breed:  { min: 2, max: 7 }
    };
    openSettings();
  }
  settingsBtn.addEventListener('click', function (e) { e.stopPropagation(); openSettings(); });
  document.getElementById('setSaveBtn').addEventListener('click', saveSettings);
  document.getElementById('setResetBtn').addEventListener('click', resetSettings);
  settingsOverlay.addEventListener('click', function (e) { if (e.target === settingsOverlay) settingsOverlay.classList.add('hidden'); });

  /* ===== 事件 ===== */
  startBtn.addEventListener('click', startMatch);
  againBtn.addEventListener('click', restartMatch);
  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', function () {
    if (gameState === 'idle') return;
    setPaused(false);
    restartMatch();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      if (gameState !== 'idle') { setPaused(false); restartMatch(); }
    }
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && !paused && (gameState === 'running' || gameState === 'champion')) {
      setPaused(true);
    }
  });

  renderRank();

  /* 首帧 */
  render();
})();
</script>
</body>
</html>
